[package]
name = "whisper-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive", "env"] }
dirs = "6.0.0"
futures-util = "0.3.34"
hound = "3.5.1"
indicatif = "0.18.6"
ort = "2.0.0-rc.13"
reqwest = { version = "0.13.4", features = ["stream"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs"] }
whisper-rs = { version = "0.16.0", features = ["cuda"] }
