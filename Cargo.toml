[package]
name = "transcribe-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
dirs = "6.0.0"
futures-util = "0.3.34"
indicatif = "0.18.6"
reqwest = { version = "0.13.4", features = ["stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs"] }
